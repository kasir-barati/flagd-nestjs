services:
  flagd-nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000' # NestJS REST API (flag management)
      - '8013:8013' # flagd gRPC (flag evaluation for backends)
      - '8016:8016' # flagd OFREP/HTTP (flag evaluation for frontends)
      # Port 8014 (metrics/sync) is NOT exposed — internal only
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/healthcheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
